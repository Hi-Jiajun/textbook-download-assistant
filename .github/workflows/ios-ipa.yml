name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 查看工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（未签名）
        working-directory: ios
        run: |
          xcodebuild \
            -project TextbookDownloader.xcodeproj \
            -scheme TextbookDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成未签名 IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/TextbookDownloader.app"
          test -d "$APP"
          rm -rf Payload TextbookDownloader-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TextbookDownloader-unsigned.ipa Payload
          shasum -a 256 TextbookDownloader-unsigned.ipa | tee ipa-sha256.txt
          ls -lh TextbookDownloader-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            ios/TextbookDownloader-unsigned.ipa
            ios/ipa-sha256.txt
          if-no-files-found: error

  # 编译通过不等于能跑：这里在模拟器上真正启动一次，并截图留档。
  smoke-test-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 选择一台 iPhone 模拟器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: 编译模拟器版本
        working-directory: ios
        run: |
          xcodebuild \
            -project TextbookDownloader.xcodeproj \
            -scheme TextbookDownloader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 安装并启动
        working-directory: ios
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build-sim/Build/Products/Debug-iphonesimulator/TextbookDownloader.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.jiaocai.textbook
          sleep 6
          xcrun simctl io "$UDID" screenshot 01-usage-notice.png

          # 跳过首次启动声明，看主界面（教材目录需要联网拉取，等久一点）
          xcrun simctl terminate "$UDID" com.jiaocai.textbook || true
          xcrun simctl spawn "$UDID" defaults write com.jiaocai.textbook usage_notice_accepted -bool YES
          xcrun simctl launch "$UDID" com.jiaocai.textbook
          sleep 30
          xcrun simctl io "$UDID" screenshot 02-browse.png

          # 断言没有崩溃：模拟器把崩溃报告写到宿主机的 DiagnosticReports 目录
          ls -la *.png
          xcrun simctl spawn "$UDID" log show --last 2m --style compact \
            --predicate 'process == "TextbookDownloader"' 2>/dev/null | tail -20 || true
          # pipefail 下用 ls 匹配不到文件会返回非 0，导致脚本提前退出，这里用 nullglob 计数。
          shopt -s nullglob
          CRASH_FILES=("$HOME/Library/Logs/DiagnosticReports"/TextbookDownloader*)
          echo "崩溃报告数量：${#CRASH_FILES[@]}"
          if [ "${#CRASH_FILES[@]}" != "0" ]; then
            echo "检测到崩溃报告，冒烟测试不通过 ✗"
            head -40 "${CRASH_FILES[0]}"
            exit 1
          fi
          echo "未发现崩溃报告 ✓"

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: ios/*.png
          if-no-files-found: error
