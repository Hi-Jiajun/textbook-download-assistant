name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 查看工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（未签名）
        working-directory: ios
        run: |
          xcodebuild \
            -project TextbookDownloader.xcodeproj \
            -scheme TextbookDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成未签名 IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/TextbookDownloader.app"
          test -d "$APP"
          rm -rf Payload TextbookDownloader-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TextbookDownloader-unsigned.ipa Payload
          shasum -a 256 TextbookDownloader-unsigned.ipa | tee ipa-sha256.txt
          ls -lh TextbookDownloader-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            ios/TextbookDownloader-unsigned.ipa
            ios/ipa-sha256.txt
          if-no-files-found: error
