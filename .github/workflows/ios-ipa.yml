name: Build iOS IPA (unsigned)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ios/**"
      - ".github/workflows/ios-ipa.yml"

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 查看工具链版本
        run: |
          xcodebuild -version
          swift --version

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 编译（未签名）
        working-directory: ios
        run: |
          xcodebuild \
            -project TextbookDownloader.xcodeproj \
            -scheme TextbookDownloader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 打包成未签名 IPA
        working-directory: ios
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release-iphoneos/TextbookDownloader.app"
          test -d "$APP"
          rm -rf Payload TextbookDownloader-unsigned.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry TextbookDownloader-unsigned.ipa Payload
          shasum -a 256 TextbookDownloader-unsigned.ipa | tee ipa-sha256.txt
          ls -lh TextbookDownloader-unsigned.ipa

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ios-unsigned-ipa
          path: |
            ios/TextbookDownloader-unsigned.ipa
            ios/ipa-sha256.txt
          if-no-files-found: error

  # 编译通过不等于能跑：这里在模拟器上真正启动一次，并截图留档。
  smoke-test-simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: ios
        run: xcodegen generate

      - name: 选择一台 iPhone 模拟器
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ {print $2; exit}')
          test -n "$UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: 编译模拟器版本
        working-directory: ios
        run: |
          xcodebuild \
            -project TextbookDownloader.xcodeproj \
            -scheme TextbookDownloader \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build

      - name: 安装并启动
        working-directory: ios
        run: |
          set -euo pipefail
          UDID="${{ steps.sim.outputs.udid }}"
          APP="build-sim/Build/Products/Debug-iphonesimulator/TextbookDownloader.app"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.jiaocai.textbook
          sleep 6
          xcrun simctl io "$UDID" screenshot 01-usage-notice.png

          # 跳过首次启动声明，看主界面（网络拉取教材目录）
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.jiaocai.textbook data)
          defaults write "$CONTAINER/Library/Preferences/com.jiaocai.textbook" usage_notice_accepted -bool YES
          xcrun simctl terminate "$UDID" com.jiaocai.textbook || true
          xcrun simctl launch "$UDID" com.jiaocai.textbook
          sleep 20
          xcrun simctl io "$UDID" screenshot 02-browse.png

          # 打开「关于与免责」
          ls -la *.png

      - name: 上传截图
        uses: actions/upload-artifact@v4
        with:
          name: ios-simulator-screenshots
          path: ios/*.png
          if-no-files-found: error
